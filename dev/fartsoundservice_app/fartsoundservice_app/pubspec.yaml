name: fartsoundservice_app
description: A fun fart sound application.
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ">=3.2.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.1
  audioplayers: ^5.2.1

  # i18n
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/sounds/
